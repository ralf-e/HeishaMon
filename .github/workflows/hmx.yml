name: HMX ESP32-S3 build
on:
  workflow_dispatch:
  push:
    branches: [touch-display]
    paths:
      - 'touch-extension/**'
      - 'HeishaMon/**'
      - '.github/workflows/hmx.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: touch-extension
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sketch preparation exports the reviewed upstream base commit.
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Python and C++ regression checks
        run: |
          python3 tools/prepare_firmware.py
          python3 tests/test_integration.py
          python3 tests/test_fork_build.py
          g++ -std=c++17 -fsyntax-only tests/policy_compile.cpp
          g++ -std=c++17 -fsyntax-only tests/model_compile.cpp
          python3 tools/update_model_table.py --check
          node tests/test_preview.mjs
          python3 tools/apply_extension.py firmware --check
      - name: Install ESP32 toolchain and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "RingBuffer@1.0.5" "PubSubClient@2.8" "ArduinoJson@7.4.3" "DallasTemperature@4.0.6" "OneWire@2.3.8" "Adafruit GFX Library@1.13.0" "Adafruit BusIO@1.17.4"
      - name: Compile ESP32-S3 application
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=enabled,PartitionScheme=min_spiffs --library vendor/Adafruit_NeoPixel --output-dir output/firmware firmware/HeishaMon
          python3 tools/package_firmware.py output/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: HeishaMon-HMX-ESP32S3-development
          path: |
            touch-extension/output/firmware/HeishaMon_ESP32-HMX-*.bin
            touch-extension/output/firmware/firmware_manifest.json
